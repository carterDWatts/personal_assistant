name: personal-assistant

services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      PGDATABASE: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  database:
  database-config:
