# Start only after restoring and verifying the database. No worker runs here.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  auth:
    <<: *service
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:?Set the public HTTPS address}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/assistant
      GOTRUE_SITE_URL: personal-assistant://auth/callback
      GOTRUE_URI_ALLOW_LIST: personal-assistant://auth/callback
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Generate private signing keys}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      # Fail closed until an actual mail transport is configured.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${EMAIL_LOGIN_ENABLED:-false}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_NAME:-Personal Assistant}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    <<: *service
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/assistant
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000

  storage:
    <<: *service
    image: supabase/storage-api:v1.89.12@sha256:8526956cb462e9f7d392e9848ec77133b2769982ed614e9753cc687e8e4339a6
    depends_on: [rest]
    environment:
      ANON_KEY: ${ANON_KEY:?Generate the public API key}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Generate the private service key}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/assistant
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: objects
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: assistant
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - objects:/var/lib/storage

  functions:
    <<: *service
    image: denoland/deno:2.5.6@sha256:3ea71953ff50e3ff15c377ead1a8521f624e2f43d27713675a8bed7b33f166aa
    depends_on: [auth, rest, storage]
    env_file:
      - path: .connectors.env
        required: false
    environment:
      SUPABASE_URL: http://api:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ../../supabase/functions/assistant:/app/supabase/functions/assistant:ro
      - ../../shared:/app/shared:ro
      - ../../identity.json:/app/identity.json:ro
    command: [run, --allow-env, --allow-net, --allow-read=/app, /app/supabase/functions/assistant/index.ts]

  api:
    <<: *service
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    depends_on: [auth, rest, storage, functions]
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  objects:
