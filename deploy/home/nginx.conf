events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream auth_backend { zone auth 64k; server auth:9999 resolve; }
    upstream rest_backend { zone rest 64k; server rest:3000 resolve; }
    upstream storage_backend { zone storage 64k; server storage:5000 resolve; }
    upstream functions_backend { zone functions 64k; server functions:8000 resolve; }
    # URLs can carry short-lived login codes or signed object tokens.
    access_log off;
    server_tokens off;
    client_max_body_size 52m;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        location = /health {
            default_type application/json;
            return 200 '{"status":"gateway"}';
        }
        location /auth/v1/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://auth_backend/;
        }
        location /rest/v1/ {
            proxy_pass http://rest_backend/;
        }
        location /storage/v1/ {
            proxy_set_header X-Forwarded-Prefix /storage/v1;
            proxy_pass http://storage_backend/;
        }
        location /functions/v1/assistant {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_pass http://functions_backend;
        }
        location / { return 404; }
    }
}
