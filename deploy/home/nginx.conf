events {}
http {
    # URLs can carry short-lived login codes or signed object tokens.
    access_log off;
    server_tokens off;
    client_max_body_size 52m;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        location = /health {
            default_type application/json;
            return 200 '{"status":"gateway"}';
        }
        location /auth/v1/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://auth:9999/;
        }
        location /rest/v1/ {
            proxy_pass http://rest:3000/;
        }
        location /storage/v1/ {
            proxy_set_header X-Forwarded-Prefix /storage/v1;
            proxy_pass http://storage:5000/;
        }
        location /functions/v1/assistant {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_pass http://functions:8000;
        }
        location / { return 404; }
    }
}
