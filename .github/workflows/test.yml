name: Test assistant changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: assistant-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright==1.62.0 pytest
      - run: python -m playwright install --with-deps chromium
      - run: scripts/test.sh
  apps:
    name: assistant-apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/Assistant.xcodeproj -scheme Assistant -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: swiftc -parse-as-library desktop/PersonalAssistant.swift shared/ContextImport.swift shared/BrowserAccess.swift shared/DaySchedule.swift shared/BunnyGlyph.swift desktop/BunnyArtwork.swift desktop/OutputStream.swift desktop/LiveVoice.swift desktop/LocalSpeech.swift desktop/LocalVoice.swift desktop/VoiceTurn.swift -o /tmp/assistant-check -framework SwiftUI -framework AVFoundation
