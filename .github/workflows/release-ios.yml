name: Release iPhone app
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'identity.json'
      - 'scripts/release-ios.py'
      - 'scripts/testflight.py'
      - '.github/workflows/release-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyJWT==2.10.1 cryptography==46.0.5 requests==2.32.5
      - name: Prepare signing
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12 }}
          APPLE_SIGNING_PASSWORD: ${{ secrets.APPLE_SIGNING_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os, secrets, subprocess
          from pathlib import Path
          key = Path(os.environ['ASC_KEY_PATH'])
          key.touch(mode=0o600)
          key.write_text(os.environ['ASC_PRIVATE_KEY'])
          chain = str(Path(os.environ['RUNNER_TEMP']) / 'signing.keychain-db')
          password = secrets.token_urlsafe(32)
          cert = Path(os.environ['RUNNER_TEMP']) / 'signing.p12'
          cert.touch(mode=0o600)
          cert.write_bytes(base64.b64decode(os.environ['APPLE_SIGNING_P12']))
          commands = [
              ['create-keychain', '-p', password, chain],
              ['set-keychain-settings', '-lut', '3600', chain],
              ['unlock-keychain', '-p', password, chain],
              ['import', str(cert), '-k', chain, '-P', os.environ['APPLE_SIGNING_PASSWORD'], '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'],
              ['set-key-partition-list', '-S', 'apple-tool:,apple:', '-k', password, chain],
              ['list-keychains', '-d', 'user', '-s', chain],
          ]
          for command in commands:
              result = subprocess.run(['security', *command], capture_output=True)
              if result.returncode: raise SystemExit('Signing keychain setup failed: ' + command[0])
          cert.unlink()
          build = 1000 + int(os.environ['GITHUB_RUN_NUMBER']) * 10 + int(os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'IPHONE_BUILD={build}\n')
          PY
      - name: Archive and upload
        run: python scripts/release-ios.py --build-number "$IPHONE_BUILD"
      - name: Verify TestFlight availability
        run: python scripts/testflight.py "$IPHONE_BUILD" --output "$RUNNER_TEMP/release.json"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          info = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          title = subprocess.check_output(['git', 'log', '-1', '--format=%s'], text=True).strip()
          notes = Path(os.environ['RUNNER_TEMP']) / 'release.md'
          notes.write_text(f"Version {info['version']}, build {info['build']}, is available to internal TestFlight testers.\n\n{title}\n\nCommit: {info['commit']}\n")
          tag = 'ios-' + os.environ['GITHUB_SHA']
          exists = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
          args = ['gh', 'release', 'edit' if exists else 'create', tag, '--title', f"iPhone build {info['build']}", '--notes-file', str(notes)]
          if not exists: args += ['--target', os.environ['GITHUB_SHA'], '--prerelease']
          subprocess.run(args, check=True)
          PY
      - name: Remove signing key
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/signing.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
