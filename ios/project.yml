name: Assistant
options:
  bundleIdPrefix: com.carterwatts
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4235PLF92D
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
targets:
  Assistant:
    type: application
    platform: iOS
    dependencies:
      - package: SpotifyiOS
    sources:
      - path: Assistant
      - path: ../shared/IntegrationCatalog.swift
      - path: ../shared/SpotifyCommand.swift
      - path: ../shared/DaySchedule.swift
      - path: ../shared/integrations.json
        buildPhase: resources
      - path: ../shared/ContextImport.swift
      - path: ../desktop/VoiceTurn.swift
      - path: ../identity.json
        buildPhase: resources
    info:
      path: Assistant/Info.plist
      properties:
        CFBundleDisplayName: Bunny Man
        CFBundleName: Bunny Man
        NSMicrophoneUsageDescription: The microphone is on while a voice conversation is on.
        NSSpeechRecognitionUsageDescription: What you say is turned into text so the assistant can answer.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [spotify]
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.carterwatts.assistant.auth
            CFBundleURLSchemes:
              - personal-assistant
    entitlements:
      path: Assistant/Assistant.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carterwatts.assistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Name the app from identity.json
        inputFiles:
          - $(SRCROOT)/../identity.json
        script: |
          name=$(/usr/bin/plutil -extract name raw -o - "$SRCROOT/../identity.json")
          /usr/bin/plutil -replace CFBundleDisplayName -string "$name" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/bin/plutil -replace CFBundleName -string "$name" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  AssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AssistantTests
    dependencies:
      - target: Assistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AssistantUITests]
    dependencies:
      - target: Assistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Assistant:
    build:
      targets:
        Assistant: all
        AssistantTests: [test]
        AssistantUITests: [test]
    test:
      environmentVariables:
        ASSISTANT_VOICE_TEST: "1"
        ASSISTANT_TEST_MODEL: "$(ASSISTANT_TEST_MODEL)"
      targets: [AssistantUITests, AssistantTests]
